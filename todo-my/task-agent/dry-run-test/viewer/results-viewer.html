<title>Dry-Run 结果控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --surface-2:   #f1f1ee;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --muted:       #898781;
    --line:        #e1e0d9;
    --line-strong: #c3c2b7;

    --good:     #0ca30c;
    --good-bg:  #e4f5e1;
    --warn:     #b8790f;
    --warn-bg:  #fdf1da;
    --crit:     #d03b3b;
    --crit-bg:  #fbe6e4;

    --g1: #2a78d6; --g1-bg: #e4eefb; /* 系统 System */
    --g2: #14926a; --g2-bg: #e0f3ec; /* 导航 Navigation (darkened aqua for light-surface legibility) */
    --g3: #a06a00; --g3-bg: #faf0da; /* 巡检 Inspect (darkened yellow) */
    --g4: #008300; --g4-bg: #e1f1e1; /* 感知 Perception */
    --g5: #4a3aa7; --g5-bg: #eae7f8; /* 基础动作 Primitive */
    --g6: #e34948; --g6-bg: #fce6e6; /* 歧义/无效 Ambiguous */

    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Noto Sans Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;

    --radius: 5px;
  }

  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #17181a; --surface-2: #1e2023;
    --ink: #f2f2f0; --ink-2: #c3c2b7; --muted: #8b8a84;
    --line: #2c2e30; --line-strong: #3a3d40;
    --good: #3fc23f; --good-bg: #103a17;
    --warn: #e0a83a; --warn-bg: #3a2c0c;
    --crit: #e2685f; --crit-bg: #3d1614;
    --g1: #5c9ce8; --g1-bg: #16283f;
    --g2: #3fbd93; --g2-bg: #103628;
    --g3: #d9a733; --g3-bg: #3a2c0c;
    --g4: #4fbf4f; --g4-bg: #143a14;
    --g5: #9c8fe8; --g5-bg: #241c40;
    --g6: #e87b7a; --g6-bg: #3d1c1c;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0d; --surface: #17181a; --surface-2: #1e2023;
      --ink: #f2f2f0; --ink-2: #c3c2b7; --muted: #8b8a84;
      --line: #2c2e30; --line-strong: #3a3d40;
      --good: #3fc23f; --good-bg: #103a17;
      --warn: #e0a83a; --warn-bg: #3a2c0c;
      --crit: #e2685f; --crit-bg: #3d1614;
      --g1: #5c9ce8; --g1-bg: #16283f;
      --g2: #3fbd93; --g2-bg: #103628;
      --g3: #d9a733; --g3-bg: #3a2c0c;
      --g4: #4fbf4f; --g4-bg: #143a14;
      --g5: #9c8fe8; --g5-bg: #241c40;
      --g6: #e87b7a; --g6-bg: #3d1c1c;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { text-wrap: balance; font-weight: 650; margin: 0; }
  p { margin: 0 0 0.85em; max-width: 62ch; }
  a { color: inherit; }
  code, .mono { font-family: var(--mono); }
  .tabular { font-variant-numeric: tabular-nums; }

  /* ---------- shell layout ---------- */
  .shell {
    display: grid;
    grid-template-columns: 216px 1fr;
    min-height: 100vh;
  }
  .rail {
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }
  .brand b { display: block; font-size: 14px; letter-spacing: 0.02em; }
  .brand span { color: var(--muted); }

  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 8px 4px;
  }
  .nav-hint {
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--muted);
    padding: 2px 8px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    border: 1px solid transparent;
    background: none;
    color: var(--ink);
    text-align: left;
    width: 100%;
    font-family: var(--sans);
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active {
    background: var(--surface-2);
    border-color: var(--line-strong);
    font-weight: 600;
  }
  .nav-item .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .nav-item.active .count { color: var(--ink-2); }
  .nav-item .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  .rail-foot { margin-top: auto; font-size: 11.5px; color: var(--muted); }
  .theme-toggle {
    font-family: var(--mono);
    font-size: 11px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: var(--radius);
    padding: 5px 8px;
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--line-strong); }

  .main { padding: 28px 34px 60px; max-width: 1180px; }

  /* ---------- overview ---------- */
  .ov-hero {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ov-hero h1 { font-size: 25px; }
  .ov-hero .lede { color: var(--ink-2); max-width: 68ch; margin-top: 4px; }

  .section { margin-bottom: 34px; }
  .section h2 {
    font-size: 15px;
    font-family: var(--mono);
    letter-spacing: 0.01em;
    margin-bottom: 12px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .section h2 .n { color: var(--muted); font-weight: 500; }

  /* pipeline diagram */
  .pipeline {
    display: flex;
    align-items: stretch;
    gap: 0;
    flex-wrap: wrap;
    margin: 14px 0 10px;
  }
  .pipe-stage {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 14px;
    min-width: 128px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    justify-content: center;
  }
  .pipe-stage .t { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .pipe-stage .d { font-size: 11.5px; color: var(--muted); }
  .pipe-arrow {
    display: flex;
    align-items: center;
    padding: 0 8px;
    color: var(--line-strong);
    font-size: 15px;
  }
  .pipe-branch {
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 11.5px;
    color: var(--ink-2);
    margin-top: 10px;
  }

  /* legend */
  .legend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 12.5px;
  }
  .legend-row .desc { color: var(--muted); font-size: 11.5px; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    line-height: 1.6;
  }
  .layer-badge {
    display: inline-flex;
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--line-strong);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-pass { background: var(--good-bg); color: var(--good); }
  .status-fail { background: var(--crit-bg); color: var(--crit); }
  .status-skipped { background: var(--warn-bg); color: var(--warn); }

  /* judgment logic callout */
  .rule-list { display: flex; flex-direction: column; gap: 10px; }
  .rule {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .rule .k { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  .rule .v { font-size: 12.5px; }
  .rule .v b { font-family: var(--mono); font-weight: 700; }

  /* worked example */
  .example {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }
  .example.mock { border-style: dashed; }
  .example-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 13px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .example-head .cmd { font-family: var(--mono); font-size: 12.5px; }
  .example-mock-flag {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .example-body { padding: 12px 13px; display: flex; flex-direction: column; gap: 9px; }
  .ex-field { display: grid; grid-template-columns: 108px 1fr; gap: 10px; font-size: 12.5px; align-items: start; }
  .ex-field .k { color: var(--muted); font-family: var(--mono); font-size: 11.5px; padding-top: 1px; }
  .ex-diff { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ex-diff .exp { color: var(--muted); text-decoration: line-through; font-family: var(--mono); }
  .ex-diff .act { font-family: var(--mono); }
  .ex-diff .act.bad { color: var(--crit); font-weight: 600; }
  .ex-diff .act.ok { color: var(--ink); }
  .ex-diff .arrow { color: var(--line-strong); }
  .ex-note { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 8px 10px; }

  /* ---------- results view ---------- */
  .res-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .res-title h1 { font-size: 19px; font-family: var(--mono); }
  .res-title .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-tile {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 7px 12px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 64px;
  }
  .stat-tile .num { font-family: var(--mono); font-size: 17px; font-weight: 700; }
  .stat-tile .lbl { font-size: 10.5px; color: var(--muted); letter-spacing: 0.03em; }
  .stat-tile.pass .num { color: var(--good); }
  .stat-tile.fail .num { color: var(--crit); }
  .stat-tile.skip .num { color: var(--warn); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 6px 10px;
    border: none;
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--surface-2); color: var(--ink); font-weight: 700; }
  .seg button:hover:not(.active) { background: var(--surface-2); }

  select, input[type="search"] {
    font-family: var(--sans);
    font-size: 12.5px;
    padding: 6px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
  }
  input[type="search"] { flex: 1; min-width: 160px; }
  .toolbar .hint { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  .table-wrap {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: auto;
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface-2);
    text-align: left;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-2);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line-strong);
    white-space: nowrap;
    cursor: help;
  }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.rowmain { cursor: pointer; }
  tbody tr.rowmain:hover { background: var(--surface-2); }
  tbody tr.rowmain.open { background: var(--surface-2); }
  .cell-input { max-width: 260px; font-family: var(--mono); }
  .cell-diff { display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); white-space: nowrap; }
  .cell-diff .exp { color: var(--muted); text-decoration: line-through; font-size: 11px; }
  .cell-diff .act.bad { color: var(--crit); font-weight: 700; }
  .cell-note-flag { color: var(--muted); font-size: 12px; }
  .id-cell { color: var(--muted); font-family: var(--mono); }

  tr.detail-row td {
    background: var(--surface-2);
    padding: 0;
  }
  .detail {
    padding: 14px 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px 22px;
  }
  .detail-block h4 {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .detail-field { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 12px; margin-bottom: 5px; }
  .detail-field .k { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .detail-field .v { font-family: var(--mono); word-break: break-word; }
  .detail-field .v.mismatch { color: var(--crit); font-weight: 700; }
  .detail-note {
    grid-column: 1 / -1;
    font-size: 12.5px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 11px;
  }
  .detail-route {
    grid-column: 1 / -1;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-2);
  }

  .empty-state { padding: 30px; text-align: center; color: var(--muted); font-size: 13px; }

  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: relative; height: auto; }
  }
</style>

<div class="shell">
  <nav class="rail">
    <div class="brand"><b>Dry-Run Console</b><span>robot_agent / robot_skills</span></div>

    <div class="nav-group">
      <div class="nav-label">概览</div>
      <button class="nav-item" data-view="overview">首页说明</button>
    </div>

    <div class="nav-group">
      <div class="nav-label">Parser Matrix</div>
      <button class="nav-item" data-view="parser_real_lab_en">real_lab · EN</button>
      <button class="nav-item" data-view="parser_real_lab_jp">real_lab · JP</button>
      <button class="nav-item" data-view="parser_warehouse_en">warehouse · EN</button>
      <button class="nav-item" data-view="parser_warehouse_jp">warehouse · JP</button>
    </div>

    <div class="nav-group">
      <div class="nav-label">Perception Capability Matrix</div>
      <button class="nav-item" data-view="perception_capability_real_lab">real_lab 下跑</button>
      <button class="nav-item" data-view="perception_capability_warehouse">warehouse 下跑</button>
    </div>
    <div class="nav-hint">同一份 case 文件，两套地图各跑一次——用来证明感知能力与场景无关</div>

    <div class="rail-foot">
      <button class="theme-toggle" id="themeToggle">切换主题</button>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<script>
(function () {

  var FILE_META = {

    parser_real_lab_jp:   { kind: "parser", scenario: "real_lab", lang: "JP", label: "Parser · real_lab · JP" },
    parser_warehouse_en:  { kind: "parser", scenario: "warehouse", lang: "EN", label: "Parser · warehouse · EN" },
    parser_warehouse_jp:  { kind: "parser", scenario: "warehouse", lang: "JP", label: "Parser · warehouse · JP" },
    perception_capability_real_lab:  { kind: "perception", scenario: "real_lab", lang: "EN/JP", label: "Perception · capability matrix · real_lab" },

  // category -> [group key, group label] for the parser matrices.
  var PARSER_GROUPS = {
    system_status: ["g1", "系统"], system_cancel: ["g1", "系统"], system_list_targets: ["g1", "系统"],
    nav_object: ["g2", "导航"], nav_place: ["g2", "导航"], nav_generic_ambiguous: ["g2", "导航"],
    nav_typo: ["g2", "导航"], nav_relational_qualifier: ["g2", "导航"],
    inspect: ["g3", "巡检"],
    perception_here: ["g4", "感知"], perception_here_underspecified: ["g4", "感知"],
    search_here: ["g4", "感知"], search_near: ["g4", "感知"],
    robot_primitive: ["g5", "基础动作"],
    ambiguous_invalid: ["g6", "歧义/无效"]
  };

  // perception category -> [group key, axis label]. The axis is *what kind of
  // capability this row is testing* (color / object / text / composite / JP /
  // fully-unknown) -- a coarser grouping than the ~17 distinct category
  // values, which stay visible in the tag text itself.
  var PERCEPTION_AXIS = {
    color_capable: ["g1", "颜色"], color_not_capable: ["g1", "颜色"],
    object_yolo_direct: ["g2", "物体"], object_yolo_open_vocab: ["g2", "物体"],
    object_yolo_fallback_only: ["g2", "物体"], object_registered_zero_capability: ["g2", "物体"],

    text_ocr: ["g3", "文字/OCR"],
    composite_both_capable: ["g4", "组合"], composite_color_capable_object_not: ["g4", "组合"],
    composite_object_capable_color_not: ["g4", "组合"], composite_both_incapable: ["g4", "组合"],
    jp_composite_registered: ["g5", "JP"], jp_object_registered: ["g5", "JP"], jp_object_open_vocab_gap: ["g5", "JP"],
    fully_unknown: ["g6", "完全未知"]

  // Perception rows carry a *capability tier* orthogonal to the axis above --
  // "does this query end up attempting a real detection at all" -- which is a
  // status-like dimension (good/warn/critical), not an identity one, so it's
  // rendered with the status palette rather than a categorical color.
  var PERCEPTION_TIER = {
    color_capable: "full", object_yolo_direct: "full", object_yolo_open_vocab: "full",
    object_yolo_fallback_only: "full", text_ocr: "full", composite_both_capable: "full",
    jp_composite_registered: "full", jp_object_registered: "full",
    composite_color_capable_object_not: "partial", composite_object_capable_color_not: "partial",
    jp_object_open_vocab_gap: "partial",
    color_not_capable: "none", object_registered_zero_capability: "none",
    object_unregistered_not_real_class: "none", object_abstract: "none",
    composite_both_incapable: "none", fully_unknown: "none"
  };
  var TIER_LABEL = { full: "能力充分", partial: "部分能力", none: "无法检测" };

  function capabilityTier(row) {
    return PERCEPTION_TIER[row.category] || null;
  }

  function tierPill(tier) {
    if (!tier) return "";
    var cls = tier === "full" ? "status-pass" : tier === "partial" ? "status-skipped" : "status-fail";
    return '<span class="status-pill ' + cls + '"><span class="dot" style="background:currentColor"></span>' + esc(TIER_LABEL[tier]) + "</span>";
  }

  function groupFor(fileKey, row) {
    var meta = FILE_META[fileKey];
    if (meta.kind === "parser") {
      return PARSER_GROUPS[row.category] || ["g1", row.category || "其它"];
    }
    return PERCEPTION_AXIS[row.category] || ["g1", row.category || row.expected_type || "其它"];
  }

  function tagHtml(groupKeyLabel, text) {
    var key = groupKeyLabel[0];
    return '<span class="tag" style="background:var(--' + key + '-bg);color:var(--' + key + ')">' + esc(text) + "</span>";
  }

  function esc(s) {
    if (s === undefined || s === null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function truthy(s) { return String(s).toLowerCase() === "true"; }

  function statusPill(status) {
    var cls = status === "PASS" ? "status-pass" : status === "SKIPPED" ? "status-skipped" : "status-fail";
    var label = status === "PASS" ? "PASS" : status === "SKIPPED" ? "SKIPPED" : "FAIL";
    return '<span class="status-pill ' + cls + '"><span class="dot" style="background:currentColor"></span>' + label + "</span>";
  }

  function layerBadge(layer) {
    if (!layer) return '<span class="layer-badge" style="opacity:.5">—</span>';
    return '<span class="layer-badge">' + esc(layer) + "</span>";
  }

  // ---------- column glossary (used by both the overview page and <th title=""> tooltips) ----------

  var PARSER_COL_DOCS = {

    expected_choice_count: "期望提供给用户选择的候选项数量（仅歧义类用例会填）。",
    expected_choice_task_types: "期望候选项覆盖的任务类型集合，用分号分隔。",
    notes: "该用例的背景说明——通常记录它属于哪个 finding（F1…F12）的回归测试，或解释为什么某个结果是预期内的。",
    actual_layer: "解析器实际停在哪一层并接受了结果。",
    actual_task_type: "解析器实际输出的任务类型。",
    actual_target: "解析器实际输出的目标名称。",
    actual_object_query: "解析器实际输出的感知查询对象。",
    actual_constraints: "解析器实际输出的附加参数（JSON）。",
    actual_ambiguity_reason: "解析器实际给出的歧义原因标识。",
    actual_choice_count: "解析器实际给出的候选项数量。",
    actual_choice_task_types: "解析器实际给出的候选项任务类型集合。",
    actual_choice_labels: "候选项的人类可读文案（Ambiguity Gate 用 label，Embedding 用匹配到的模板原文）——用于判断给用户的选项是否合理，而不仅仅是数量或类型对不对。",
    layer_match: "actual_layer 是否与 expected_layer 一致（expected 留空时视为通过）。",
    task_type_match: "actual_task_type 是否与 expected_task_type 一致。",
    target_match: "actual_target 是否与 expected_target 一致。",
    object_query_match: "actual_object_query 是否与 expected_object_query 一致。",
    constraints_match: "actual_constraints 是否包含 expected_constraints 里要求的全部字段和数值。",
    ambiguity_reason_match: "actual_ambiguity_reason 是否与期望一致。",
    choice_count_match: "actual_choice_count 是否与期望一致。",
    overall_pass: "综合判定：只要上面任意一项被检查且不一致，就是 FAIL；如果这一行期望走 LLM Fallback 而本机没有可用的 LLM，则标记 SKIPPED。",
    route_trace_summary: "解析器实际经过的路由轨迹：每一层的状态（accepted/rejected）以及匹配分数或拒绝原因。"
  };

  var PERCEPTION_COL_DOCS = {

    category: "用例分类，按能力维度分组（颜色/物体/文字/组合/JP/完全未知），决定左侧彩色分组标签；具体子类型（如 object_yolo_fallback_only）保留在标签文字里。",
    query: "喂给 PerceptionSkills 检测规划器的原始查询文本——这是 Parser Matrix 交出来的原始短语，不是预先分词过的形式。",
    expected_type: "期望的查询类型：color / object / text / composite / abstract / unsupported。",
    expected_colors: "期望识别出的颜色列表，分号分隔。",
    expected_objects: "期望识别出的物体列表，分号分隔。",
    expected_text_kind: "期望识别出的文字类别（如 digit / letter / text / shelf_label）。",
    expected_yolo_classes: "期望触发的 YOLO 直接检测类别（仅描述性，不做硬性比对）。",
    expected_detectors: "期望被调用的检测器组合（hsv_color_region / yolo / ocr / composite_overlap）。",
    expected_unsupported_reason_count: "期望给出的“不支持”原因条数。",
    expected_forces_needs_human: "是否期望这一行的 *查询类型本身* 就强制转人工（仅 abstract/unsupported 类型为 true）——注意：即使这里是 false，只要 unsupported 原因数 > 0，实际执行时仍会在检测后要求人工确认，只是不会跳过检测本身。",
    notes: "该用例的背景说明，含具体能力判定依据（比如某个物体是靠 fallback_classes 还是真实类别检测到的）。",
    actual_type: "规划器实际判定的查询类型。",
    actual_colors: "规划器实际识别出的颜色。",
    actual_objects: "规划器实际识别出的物体（含通过 fallback 或开放词汇匹配到的）。",
    actual_text_kind: "规划器实际识别出的文字类别。",
    actual_yolo_classes: "规划器实际会直接用来过滤 YOLO 的真实类别——这些类别在当前 yolo11s.pt 里是真实存在的。",
    actual_fallback_classes: "当物体本身配置的类别都不是真实类别时，退而求其次实际会用的近似类别（如 box → suitcase，bucket → bottle/cup/bowl）。为空表示这个物体不需要 fallback，要么直接命中真实类别，要么完全不可检测。",

    type_match: "actual_type 是否与 expected_type 一致。",
    colors_match: "actual_colors 是否与 expected_colors 一致。",
    objects_match: "actual_objects 是否与 expected_objects 一致。",
    text_kind_match: "actual_text_kind 是否与 expected_text_kind 一致。",
    detectors_match: "actual_detectors 是否与 expected_detectors 一致。",
    overall_pass: "综合判定：上面任意一项被检查且不一致就是 FAIL。"
  };

  // ---------- state ----------

  var state = { view: "overview", statusFilter: "ALL", groupFilter: "ALL", search: "", openRow: null };

  function computeCounts(fileKey) {
    var rows = DATA[fileKey] || [];
    var c = { total: rows.length, PASS: 0, FAIL: 0, SKIPPED: 0 };
    rows.forEach(function (r) { c[r.overall_pass] = (c[r.overall_pass] || 0) + 1; });
    return c;
  }

  function renderRail() {
    document.querySelectorAll(".nav-item").forEach(function (btn) {
      var v = btn.getAttribute("data-view");
      btn.classList.toggle("active", v === state.view);
      var existing = btn.querySelector(".count");
      if (existing) existing.remove();
      if (v !== "overview") {
        var c = computeCounts(v);
        var span = document.createElement("span");
        span.className = "count tabular";
        span.textContent = c.PASS + "/" + c.total;
        if (c.FAIL > 0) span.style.color = "var(--crit)";
        btn.appendChild(span);
      }
    });
  }

  function el(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    return d.firstElementChild;
  }

  // ---------- overview ----------

  function renderOverview() {

    });

    html += '<div class="section"><h2>整体流程</h2>';

    html += pipeStage("感知查询", "解析器只交出原始短语，如 “red rectangle”");
    html += pipeArrow();
    html += pipeStage("能力判定", "颜色/物体/文字 各自独立判定：已知 / 部分已知 / 完全未知");
    html += pipeArrow();
    html += pipeStage("检测器路由", "hsv_color_region · yolo · ocr · composite_overlap");
    html += "</div>";
    html += '<div class="pipe-branch">颜色/物体/文字的“能力”不是猜出来的——颜色看 HSV 注册表，物体看当前 yolo11s.pt 真实的 80 个 COCO 类别（外加 perception_targets.yaml 登记的 fallback 类别），文字看 OCR 别名表。<b>解析器不再做“green_door”这种预先分词</b>：那是 PerceptionSkills 的职责，解析器只负责把动词/代词之外的原始短语原样交出去。</div>';
    html += "</div>";

    html += '<div class="section"><h2>判定逻辑</h2><div class="rule-list">';
    html += rule("1", "每一行用例都有一组 <b>expected_*</b> 字段和一组 <b>actual_*</b> 字段。expected 字段留空 = 这一项不做硬性比对，只记录 actual 值供参考。");
    html += rule("2", "凡是 expected 非空的字段，都会生成一个 <b>*_match</b>（true/false）。overall_pass 只要有一个相关的 *_match 为 false，就判定 <b>FAIL</b>。");
    html += rule("3", "如果这一行期望走 <b>LLM Fallback</b>，但本机当时没有可用的本地 LLM 服务，就判定 <b>SKIPPED</b>（而不是 FAIL）——这不是解析器的问题，是测试环境的问题。");
    html += rule("4", "<b>route_trace_summary</b> 记录了解析器实际走过的每一层和结果，方便在不一致时定位是哪一层把指令引偏了。");
    html += "</div></div>";

    html += '<div class="section"><h2>标签图例 · Parser</h2><div class="legend-grid">';
    parserLegendRows.forEach(function (r) {
      html += '<div class="legend-row">' + tagHtml([r[0]], r[1]) + '<span class="desc">' + esc(r[2]) + "</span></div>";
    });
    html += '<div class="legend-row">' + layerBadge("Deterministic") + '<span class="desc">解析层徽标——描边样式，与分类颜色区分开，避免和分类标签混淆</span></div>';
    html += '<div class="legend-row">' + statusPill("PASS") + statusPill("FAIL") + statusPill("SKIPPED") + "</div>";
    html += "</div></div>";

    html += '<div class="section"><h2>标签图例 · Perception</h2>';
    html += '<p style="color:var(--ink-2)">感知矩阵的彩色标签是"能力维度"（颜色/物体/文字/组合/JP/完全未知），和右侧的"能力"徽标是两件事——后者是三档能力充分度（同色系复用 PASS/FAIL/SKIPPED 的状态色，因为这本质是个状态而不是分类）。</p>';
    html += '<div class="legend-grid">';
    perceptionLegendRows.forEach(function (r) {
      html += '<div class="legend-row">' + tagHtml([r[0]], r[1]) + '<span class="desc">' + esc(r[2]) + "</span></div>";
    });
    html += '<div class="legend-row">' + tierPill("full") + '<span class="desc">颜色/物体/文字至少有一项完全命中，直接进入检测</span></div>';
    html += '<div class="legend-row">' + tierPill("partial") + '<span class="desc">至少一项已知、至少一项未知——仍会尝试已知的部分，未知部分单独提示需要人工确认</span></div>';
    html += '<div class="legend-row">' + tierPill("none") + '<span class="desc">颜色/物体/文字全都判不出来——跳过摄像头扫描，直接汇报需要人工重新指定</span></div>';
    html += "</div></div>";

    html += '<div class="section"><h2>示例讲解</h2>';
    html += '<p style="color:var(--ink-2)">下面两个例子来自真实通过的用例，说明字段是怎么对上的；第三个例子是手工构造的<b>示例</b>（不在真实数据里），用来展示一行 FAIL 具体长什么样。</p>';

    html += exampleCard({
      cmd: "go to front door", scenario: "real_lab · EN", pass: true,
      fields: [["task_type", "navigate_to_place", "navigate_to_place", true],
               ["target", "front door", "front door", true]],
      note: "这条曾经是 bug（F9）：旧逻辑会把“front”当方位词盲目剥掉，输出变成裸的 “door”。修复后解析器会先检查“front door”本身是否已经是当前地图里的已知目标名——是的话就不再剥离，直接原样返回。"
    });

    html += exampleCard({
      cmd: "04-05棚にobject_carがありますか", scenario: "warehouse · JP", pass: true,
      fields: [["task_type", "search_object_near_place", "search_object_near_place", true],
               ["target", "04-05棚", "04-05棚", true],
               ["object_query", "object_car", "object_car", true]],
      note: "这条曾经是 bug（F11）：JP 的“棚+に+查询”规则只认识单个棚号（06棚），认不出区间棚号（04-05棚），会整句掉到 Embedding/LLM 兜底，甚至把目标和查询搞混。修复后正则同时接受两种写法。"
    });

    html += exampleCard({
      cmd: "go to sfoa", scenario: "real_lab · EN · 示例（非真实结果）", pass: false, mock: true,
      fields: [["task_type", "navigate_to_object", "navigate_to_object", true],
               ["target", "sofa", "sfoa", false]],
      note: "这是虚构的示例：如果我们要求“sfoa”这个拼写错误必须被纠正为“sofa”，target 这一项就会不一致 → target_match=false → overall_pass=FAIL。当前这类拼写纠错还没有实现（详见 finding F6），所以真实用例里我们没有对 target 做这种强校验，只是记录实际输出供人工判断。"
    });

    html += exampleCard({
      cmd: "turquoise chair", scenario: "perception capability matrix", pass: true,
      fields: [["type", "object", "object", true],
               ["objects", "chair", "chair", true],
               ["colors", "(none)", "(none)", true]],
      note: "对称的“部分能力”案例：“chair”不在 perception_targets.yaml 的物体登记表里，但它确实是当前 yolo11s.pt 模型的 80 个真实类别之一，所以仍然会被检测；“turquoise”不是已注册的 HSV 颜色，会被单独标记为“无法识别的颜色/修饰词”，而不会因此连“chair”也检测不了。这个案例曾经是 bug：未匹配的颜色词会和物体词粘在一起变成一个无法匹配的整体（“turquoisechair”），现在改成了逐词匹配。"
    });

    html += exampleCard({
      cmd: "check meeting table", scenario: "real_lab · EN", pass: true,
      fields: [["task_type", "inspect_place", "inspect_place", true],
               ["target", "meeting table", "meeting table", true]],
      note: "“check X”在结构上有歧义：可能是“搜索一个描述为 X 的物体”，也可能是“去检查一个叫 X 的地点”。区分方法是查当前地图的已知目标名单——“meeting table”是已知导航目标，所以判定为 inspect_place；对比“check for red box”，“red box”不是已知目标，判定为 search_object_here。"
    });

    html += "</div>";

    document.getElementById("main").innerHTML = html;
  }

  function pipeStage(t, d) {
    return '<div class="pipe-stage"><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + "</div></div>";
  }
  function pipeArrow() { return '<div class="pipe-arrow">→</div>'; }
  function rule(k, v) {
    return '<div class="rule"><div class="k">' + esc(k) + '</div><div class="v">' + v + "</div></div>";
  }

  function exampleCard(spec) {
    var html = '<div class="example' + (spec.mock ? " mock" : "") + '" style="margin-bottom:12px">';
    html += '<div class="example-head"><span class="cmd">' + esc(spec.cmd) + '</span>' +
      (spec.mock ? '<span class="example-mock-flag">MOCK EXAMPLE</span>' : '<span class="example-mock-flag">' + esc(spec.scenario) + "</span>") + "</div>";
    html += '<div class="example-body">';
    spec.fields.forEach(function (f) {
      var k = f[0], exp = f[1], act = f[2], ok = f[3];
      html += '<div class="ex-field"><div class="k">' + esc(k) + '</div><div class="ex-diff">';
      if (ok) {
        html += '<span class="act ok">' + esc(act) + "</span>";
      } else {
        html += '<span class="exp">' + esc(exp) + '</span><span class="arrow">→</span><span class="act bad">' + esc(act) + "</span>";
      }
      html += "</div></div>";
    });
    html += '<div class="ex-field"><div class="k">结果</div><div>' + statusPill(spec.pass ? "PASS" : "FAIL") + "</div></div>";
    html += '<div class="ex-note">' + esc(spec.note) + "</div>";
    html += "</div></div>";
    return html;
  }

  // ---------- results table ----------

  function renderResults(fileKey) {
    var meta = FILE_META[fileKey];
    var rows = DATA[fileKey] || [];
    var counts = computeCounts(fileKey);
    var docs = meta.kind === "parser" ? PARSER_COL_DOCS : PERCEPTION_COL_DOCS;

    var groupOptions = {};
    rows.forEach(function (r) { var g = groupFor(fileKey, r); groupOptions[g[1]] = g[0]; });

    var html = "";
    html += '<div class="res-head"><div class="res-title"><h1>' + esc(meta.label) + '</h1><div class="sub">场景 ' + esc(meta.scenario) + " · 语言 " + esc(meta.lang) + " · 共 " + rows.length + " 条用例</div>";
    if (meta.kind === "perception") {
      var otherScenario = fileKey.indexOf("real_lab") !== -1 ? "warehouse" : "real_lab";
      html += '<div class="sub" style="margin-top:2px">与 <b class="mono">' + esc(otherScenario) + '</b> 场景跑的是同一份 perception_capability.csv —— 感知能力只取决于 perception_targets.yaml / 模型，与地图无关，两边结果应当逐字节相同（已验证）。</div>';
    }
    html += "</div>";
    html += '<div class="stat-row">';
    html += '<div class="stat-tile"><div class="num tabular">' + counts.total + '</div><div class="lbl">TOTAL</div></div>';
    html += '<div class="stat-tile pass"><div class="num tabular">' + counts.PASS + '</div><div class="lbl">PASS</div></div>';
    html += '<div class="stat-tile fail"><div class="num tabular">' + (counts.FAIL || 0) + '</div><div class="lbl">FAIL</div></div>';
    html += '<div class="stat-tile skip"><div class="num tabular">' + (counts.SKIPPED || 0) + '</div><div class="lbl">SKIPPED</div></div>';
    html += "</div></div>";

    html += '<div class="toolbar">';
    html += '<div class="seg" id="statusSeg">';
    ["ALL", "PASS", "FAIL", "SKIPPED"].forEach(function (s) {
      html += '<button data-status="' + s + '" class="' + (state.statusFilter === s ? "active" : "") + '">' + s + "</button>";
    });
    html += "</div>";
    html += '<select id="groupSelect"><option value="ALL">全部分类</option>';
    Object.keys(groupOptions).forEach(function (g) {
      html += '<option value="' + esc(g) + '"' + (state.groupFilter === g ? " selected" : "") + ">" + esc(g) + "</option>";
    });
    html += "</select>";
    html += '<input type="search" id="searchBox" placeholder="搜索输入指令 / 查询文本 / 备注…" value="' + esc(state.search) + '" />';
    html += '<span class="hint">点击一行展开全部字段</span>';
    html += "</div>";

    html += '<div class="table-wrap"><table><thead><tr>';
    if (meta.kind === "parser") {
      html += th("#", docs.id) + th("分类", docs.category) + th("输入指令", docs.input_text) +
        th("任务类型", "expected_task_type / actual_task_type: " + docs.expected_task_type) +
        th("目标 / 查询对象", "expected_target, expected_object_query / actual 对应值") +
        th("解析层", docs.actual_layer) + th("结果", docs.overall_pass) + th("", "点击展开明细");
    } else {
      html += th("#", docs.id) + th("分类", docs.category) + th("查询文本", docs.query) +
        th("类型", "expected_type / actual_type: " + docs.expected_type) +
        th("识别结果", "颜色 / 物体 / 文字类别 (actual)，含 fallback 类别") +
        th("检测器", docs.actual_detectors) +
        th("能力", "这一行代表的是充分能力 / 部分能力（仍会尝试检测）/ 完全无法检测——由 category 派生，非硬性判定字段") +
        th("结果", docs.overall_pass) + th("", "点击展开明细");
    }
    html += "</tr></thead><tbody id=\"tbody\">";
    html += "</tbody></table></div>";

    document.getElementById("main").innerHTML = html;
    bindToolbar(fileKey);
    renderRows(fileKey);
  }

  function th(label, doc) {
    return '<th title="' + esc(doc) + '">' + esc(label) + "</th>";
  }

  function bindToolbar(fileKey) {
    document.querySelectorAll("#statusSeg button").forEach(function (b) {
      b.addEventListener("click", function () {
        state.statusFilter = b.getAttribute("data-status");
        state.openRow = null;
        renderResults(fileKey);
      });
    });
    var gsel = document.getElementById("groupSelect");
    gsel.addEventListener("change", function () {
      state.groupFilter = gsel.value;
      state.openRow = null;
      renderRows(fileKey);
    });
    var sbox = document.getElementById("searchBox");
    sbox.addEventListener("input", function () {
      state.search = sbox.value;
      state.openRow = null;
      renderRows(fileKey);
    });
  }

  function matchRow(fileKey, row) {
    if (state.statusFilter !== "ALL" && row.overall_pass !== state.statusFilter) return false;
    if (state.groupFilter !== "ALL") {
      var g = groupFor(fileKey, row);
      if (g[1] !== state.groupFilter) return false;
    }
    if (state.search) {
      var hay = ((row.input_text || "") + " " + (row.query || "") + " " + (row.notes || "") + " " + (row.category || "")).toLowerCase();
      if (hay.indexOf(state.search.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function diffCell(expKey, actKey, row) {
    var exp = row[expKey], act = row[actKey];
    var matchKey = expKey.replace("expected_", "") + "_match";
    var isMatch = row[matchKey] === undefined ? true : truthy(row[matchKey]);
    if (!exp) return '<span class="mono">' + esc(act || "—") + "</span>";
    if (isMatch) return '<span class="mono">' + esc(act || "—") + "</span>";
    return '<div class="cell-diff"><span class="exp">' + esc(exp) + '</span><span class="act bad">' + esc(act || "—") + "</span></div>";
  }

  function renderRows(fileKey) {
    var meta = FILE_META[fileKey];
    var rows = DATA[fileKey] || [];
    var tbody = document.getElementById("tbody");
    var visible = rows.filter(function (r) { return matchRow(fileKey, r); });
    var colCount = meta.kind === "parser" ? 8 : 9;

    if (visible.length === 0) {
      tbody.innerHTML = '<tr><td colspan="' + colCount + '"><div class="empty-state">没有符合筛选条件的用例</div></td></tr>';
      return;
    }

    var html = "";
    visible.forEach(function (row) {
      var g = groupFor(fileKey, row);
      var rowId = fileKey + "-" + row.id;
      var open = state.openRow === rowId;
      html += '<tr class="rowmain' + (open ? " open" : "") + '" data-row="' + rowId + '">';
      html += '<td class="id-cell tabular">' + esc(row.id) + "</td>";
      if (meta.kind === "parser") {
        html += "<td>" + tagHtml(g, g[1]) + "</td>";
        html += '<td class="cell-input">' + esc(row.input_text) + (row.notes ? ' <span class="cell-note-flag" title="有备注">note</span>' : "") + "</td>";
        html += "<td>" + diffCell("expected_task_type", "actual_task_type", row) + "</td>";
        var targetCell = row.expected_target || row.actual_target
          ? diffCell("expected_target", "actual_target", row)
          : diffCell("expected_object_query", "actual_object_query", row);
        html += "<td>" + targetCell + "</td>";
        html += "<td>" + layerBadge(row.actual_layer) + "</td>";
      } else {
        html += "<td>" + tagHtml(g, row.category || g[1]) + "</td>";
        html += '<td class="cell-input">' + esc(row.query) + (row.notes ? ' <span class="cell-note-flag" title="有备注">note</span>' : "") + "</td>";
        html += "<td>" + diffCell("expected_type", "actual_type", row) + "</td>";
        var idResult = [row.actual_colors, row.actual_objects, row.actual_fallback_classes ? "(fallback: " + row.actual_fallback_classes + ")" : "", row.actual_text_kind].filter(Boolean).join(" · ");
        html += '<td class="mono">' + esc(idResult || "—") + "</td>";
        html += '<td class="mono">' + esc(row.actual_detectors || "—") + "</td>";
        html += "<td>" + tierPill(capabilityTier(row)) + "</td>";
      }
      html += "<td>" + statusPill(row.overall_pass) + "</td>";
      html += '<td style="color:var(--muted)">' + (open ? "▾" : "▸") + "</td>";
      html += "</tr>";
      if (open) html += detailRowHtml(fileKey, row);
    });
    tbody.innerHTML = html;

    tbody.querySelectorAll("tr.rowmain").forEach(function (tr) {
      tr.addEventListener("click", function () {
        var id = tr.getAttribute("data-row");
        state.openRow = state.openRow === id ? null : id;
        renderRows(fileKey);
      });
    });
  }

  function detailField(label, expKey, actKey, row) {
    var exp = row[expKey], act = row[actKey];
    var matchKey = expKey.replace("expected_", "") + "_match";
    var isMatch = row[matchKey] === undefined ? true : truthy(row[matchKey]);
    var cls = exp && !isMatch ? "v mismatch" : "v";
    var text = act || "—";
    if (exp && !isMatch) text = esc(exp) + " → " + esc(act || "—");
    else text = esc(text);
    return '<div class="detail-field"><div class="k">' + esc(label) + '</div><div class="' + cls + '">' + text + "</div></div>";
  }

  function detailRowHtml(fileKey, row) {
    var meta = FILE_META[fileKey];
    var colCount = meta.kind === "parser" ? 8 : 9;
    var html = '<tr class="detail-row"><td colspan="' + colCount + '"><div class="detail">';

    if (meta.kind === "parser") {
      html += '<div class="detail-block"><h4>解析结果</h4>';
      html += detailField("task_type", "expected_task_type", "actual_task_type", row);
      html += detailField("target", "expected_target", "actual_target", row);
      html += detailField("object_query", "expected_object_query", "actual_object_query", row);
      html += detailField("layer", "expected_layer", "actual_layer", row);
      html += "</div>";

      html += '<div class="detail-block"><h4>附加参数 constraints</h4>';
      html += detailField("constraints", "expected_constraints", "actual_constraints", row);
      html += "</div>";

      html += '<div class="detail-block"><h4>歧义 / 候选项</h4>';
      html += detailField("reason", "expected_ambiguity_reason", "actual_ambiguity_reason", row);
      html += detailField("choice_count", "expected_choice_count", "actual_choice_count", row);
      html += detailField("choice_types", "expected_choice_task_types", "actual_choice_task_types", row);
      if (row.actual_choice_labels) {
        html += '<div class="detail-field"><div class="k">choice_labels</div><div class="v">' + esc(row.actual_choice_labels) + "</div></div>";
      }
      html += "</div>";

      html += '<div class="detail-route">route_trace_summary: ' + esc(row.route_trace_summary || "—") + "</div>";
    } else {
      html += '<div class="detail-block"><h4>类型 / 识别结果</h4>';
      html += detailField("type", "expected_type", "actual_type", row);
      html += detailField("colors", "expected_colors", "actual_colors", row);
      html += detailField("objects", "expected_objects", "actual_objects", row);
      html += detailField("text_kind", "expected_text_kind", "actual_text_kind", row);
      html += "</div>";

      html += '<div class="detail-block"><h4>检测器路由</h4>';
      html += detailField("yolo_classes", "expected_yolo_classes", "actual_yolo_classes", row);
      html += '<div class="detail-field"><div class="k">fallback_classes</div><div class="v">' + esc(row.actual_fallback_classes || "—") + "</div></div>";
      if (row.actual_fallback_classes) {
        html += '<div class="detail-field"><div class="k">fallback 需人工</div><div class="v">' + esc(row.actual_fallback_requires_human) + "</div></div>";
      }
      html += detailField("detectors", "expected_detectors", "actual_detectors", row);
      html += "</div>";

      html += '<div class="detail-block"><h4>能力判定 / 不支持</h4>';
      var tier = capabilityTier(row);
      if (tier) {
        html += '<div class="detail-field"><div class="k">capability</div><div class="v">' + tierPill(tier) + "</div></div>";
      }
      html += '<div class="detail-field"><div class="k">reasons</div><div class="v">' + esc(row.actual_unsupported_reasons || "—") + "</div></div>";
      html += detailField("forces_human", "expected_forces_needs_human", "actual_forces_needs_human", row);
      html += "</div>";
    }

    if (row.notes) {
      html += '<div class="detail-note"><b class="mono" style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">NOTES&nbsp;</b>' + esc(row.notes) + "</div>";
    }

    html += "</div></td></tr>";
    return html;
  }

  // ---------- routing ----------

  function render() {
    renderRail();
    if (state.view === "overview") renderOverview();
    else renderResults(state.view);
  }

  document.querySelectorAll(".nav-item").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.view = btn.getAttribute("data-view");
      state.statusFilter = "ALL"; state.groupFilter = "ALL"; state.search = ""; state.openRow = null;
      render();
    });
  });

  var root = document.documentElement;
  document.getElementById("themeToggle").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) root.setAttribute("data-theme", next); else root.removeAttribute("data-theme");
  });

  render();
})();

</script>
