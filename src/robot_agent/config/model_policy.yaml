policy: local_first_hybrid
providers:
  embedding_parser:
    provider: sentence_transformers
    model: intfloat/multilingual-e5-small
    accept_threshold: 0.94
    clarify_threshold: 0.75
  llama_cpp_parser:
    provider: llama_cpp
    endpoint: http://127.0.0.1:8080/v1/chat/completions
    model: qwen2.5-3b-instruct-q4_k_m
    temperature: 0
    timeout_sec: 2.0
    allowed_for_contact: false
control_critical:
  provider: local
  llm_can_authorize_motion: false
  llm_can_override_safety: false
