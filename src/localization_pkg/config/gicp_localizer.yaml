gicp_localizer:
  ros__parameters:

    # ── Map ──────────────────────────────────────────────────────────────────
    # Path to the 3D PLY map exported from GLIM.
    # This map is fixed (prior map); the localizer does NOT modify it.
    map_path: "/home/ruan-x/robot_ws/maps/sim_real_lab_001/map_3d.ply"

    # ── Downsampling ─────────────────────────────────────────────────────────
    # map_voxel_size: voxel grid applied once at startup to reduce map size.
    #   Smaller → denser map, slower match; larger → faster but less precise.
    #   0.25 m is a good balance for an indoor 20 m×15 m corridor environment.
    map_voxel_size: 0.25

    # scan_voxel_size: applied to each incoming scan before matching.
    #   Keep slightly smaller than map_voxel_size for good correspondence density.
    scan_voxel_size: 0.20

    # ── GICP parameters ───────────────────────────────────────────────────────
    # max_correspondence_distance: reject point pairs farther than this (m).
    #   Should be ≥ map_voxel_size. Larger helps convergence from poor initial
    #   pose but increases outlier risk.
    max_correspondence_distance: 1.5

    # fitness_score_threshold: INLIER RMSE above this → localization rejected,
    #   previous TF is rebroadcast unchanged.  Tune after first run.
    # Keep this aligned with the sim Agent health threshold. The Isaac MID360-like
    # cloud routinely scores 0.30..0.45 after motion; rejecting those matches
    # freezes map->odom and makes odom drift look like an undetected pose error.
    fitness_score_threshold: 0.50

    # GICP needs 3-D geometry. Do not reuse the Nav2 laser-slice height band:
    # the narrow [-0.8, -0.3] band made stationary warehouse matches unstable.
    scan_min_height: -1000000000.0
    scan_max_height: 1000000000.0
    minimum_match_fitness: 0.25
    scan_max_source_age_sec: 2.0
    fast_lio_max_stamp_skew_sec: 0.5

    # After RViz /initialpose, hold the clicked map->odom transform while several
    # stationary Livox frames are accumulated. The first correction therefore
    # uses a denser cloud instead of one sparse frame.
    initialpose_accumulation_sec: 2.5
    initialpose_min_scans: 10
    initialpose_max_scans: 30
    # Sim recovery waits for actual azimuth coverage, not a fixed guessed Hz.
    # Measure coverage before matching filters. Timeout reports degraded state
    # but continues observing bounded fresh data, allowing evidence-based retry.
    # Scan-header simulation seconds, not wall seconds or a fixed RTF estimate.
    initialpose_sim_accumulation_sec: 10.0
    initialpose_accumulation_timeout_sec: 75.0
    # Return coverage is not beam coverage: open directions can have no hits.
    initialpose_sim_azimuth_coverage: 0.90

    # The real-lab sim has repeated tables/chairs/flat walls. A single GICP
    # match can have a low RMSE while still jumping to a nearby local optimum.
    # Keep /wheel_odom + optional FAST-LIO as the continuous motion source, and
    # let GICP apply only small global corrections to map->odom.
    max_correction_translation_m: 0.35
    max_correction_yaw_rad: 0.10
    correction_alpha: 0.30
    initialpose_relocalization_updates: 3
    initialpose_max_correction_translation_m: 1.5
    initialpose_max_correction_yaw_rad: 0.40
    # Sim-only stability guard: if bounded correction rejection repeats, open a
    # wider auto-relocalization window. Keep the normal correction gate small for
    # steady navigation, but allow automatic recovery after map->odom has frozen.
    auto_relocalization_reject_count: 8
    auto_relocalization_updates: 3
    auto_relocalization_max_correction_translation_m: 6.5
    auto_relocalization_max_correction_yaw_rad: 1.40

    # normal_search_radius: KD-tree radius for normal estimation (m).
    #   ~3-4× voxel_size is a good starting point.
    normal_search_radius: 0.8

    # ── Update rate ──────────────────────────────────────────────────────────
    # Localization runs on this timer (seconds).  0.5 = 2 Hz.
    # At 0.1–0.3 m/s robot speed, 0.5 s gives ≤15 cm of motion between updates.
    localize_period: 0.5

    # TF is cheap to rebroadcast and Nav2 needs fresh transforms at controller rate.
    # Keep expensive GICP matching at localize_period, but publish the latest valid
    # map->odom transform at 30 Hz.
    tf_broadcast_period: 0.033333

    # ── TF frames ────────────────────────────────────────────────────────────
    map_frame:   "map"
    odom_frame:  "odom"
    lidar_frame: "livox_frame"

    # ── Initial pose (map frame, 2-D) ─────────────────────────────────────────
    # Robot starts at a fixed position each session (same charging station / door).
    # Set these to the approximate starting position in the map.
    # Override at launch time: ros2 launch ... initial_x:=1.5 initial_y:=0.5
    initial_x:   0.0
    initial_y:   0.0
    initial_yaw: 0.0   # radians

    # ── FAST-LIO2 hint (Phase 2) ─────────────────────────────────────────────
    # When FAST-LIO2 is running, its odometry can improve the initial pose
    # estimate for each GICP call.  Set true only after setup_fast_lio.sh.
    use_fast_lio_hint:    false
    fast_lio_odom_topic:  "/fast_lio/odometry"
