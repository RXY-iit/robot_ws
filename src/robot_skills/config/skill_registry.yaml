# Robot skill registry: execution whitelist for SkillClient.
#
# This file intentionally stays small and operational. It answers:
#   "May this robot skill be executed in dry_run/sim/real, and with what default timeout?"
#
# For parser/JEV/planning semantics, use skill_catalog.v2.yaml. That catalog
# contains natural-language aliases, args schemas, preconditions, effects,
# failure semantics, and JEV visibility.
#
# To add or extend a robot skill:
#   1. Implement the executor method in robot_skills/robot_skills/executors/.
#   2. Dispatch it from src/robot_agent/robot_agent/skill_client.py.
#   3. Add a registry item here using this template:
#        - name: new_skill_name
#          group: base_motion | view_camera | perception_detection | arm | ...
#          version: 0.1.0
#          description: One-line operational description.
#          safety_level: read_only | safety_gate | perception | navigation | motion | recovery
#          allowed_modes: [dry_run, sim, real]
#          timeout_sec: 10
#          requires_human_confirm: false
#          sim_supported: true
#          real_supported: true
#   4. Add the full semantic contract to skill_catalog.v2.yaml.
#   5. Add or update tests for SkillCatalog validation and any agent plan that
#      can emit the skill.
#
# Recovery skills should be explicit robot skills too. For example, future
# recovery extensions may add reset_camera_stream, recover_local_planner,
# restart_arm_gateway, or verify_ros_graph. Keep them in this registry only
# when they are safe, bounded, and dispatched through SkillClient.
skills:
  - name: get_robot_status
    group: health_safety
    version: 0.1.0
    description: Collect robot mode, safety status, and runtime health summary.
    safety_level: read_only
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 3
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: await_robot_auto_mode
    group: health_safety
    version: 0.1.0
    description: Wait for operator-confirmed AUTO mode before navigation.
    safety_level: safety_gate
    allowed_modes: [sim, real]
    timeout_sec: 0.1
    requires_human_confirm: true
    sim_supported: true
    real_supported: true

  - name: await_robot_stationary
    group: health_safety
    version: 0.1.0
    description: Wait until base motion is idle before camera/perception work starts.
    safety_level: safety_gate
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 180
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: check_localization_health
    group: health_safety
    version: 0.1.0
    description: Check whether localization is healthy enough to start or continue autonomous navigation.
    safety_level: safety_gate
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 2
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: recover_localization_spin
    group: health_recovery
    version: 0.1.0
    description: Stop motion, reset to the latest trusted map pose through /initialpose, rotate in place, and verify localization health.
    safety_level: localization_recovery
    allowed_modes: [dry_run, sim]
    timeout_sec: 15
    requires_human_confirm: false
    sim_supported: true
    real_supported: false

  - name: resolve_semantic_target
    group: semantic_map
    version: 0.1.0
    description: Resolve a place/object alias to a map-frame approach pose. Prefer generated poses from semantic map regions over fixed remembered poses.
    safety_level: read_only
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 1
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: list_known_targets
    group: semantic_map
    version: 0.1.0
    description: List all semantic targets known to the skill layer.
    safety_level: read_only
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 1
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: goto_pose
    group: base_motion
    version: 0.1.0
    description: Navigate the mobile base to a validated map-frame pose using Nav2 NavigateToPose.
    safety_level: navigation
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 120
    requires_human_confirm: false
    preconditions:
      - robot_mode_auto
      - safety_status_ok_or_watchdog
      - nav2_active
      - target_pose_in_map
    forbidden_effects:
      - publish_cmd_vel
      - publish_raw_motor_command
      - modify_map
    sim_supported: true
    real_supported: true

  - name: move_relative
    group: base_motion
    version: 0.1.0
    description: Move relative to the current base pose by converting a body-frame offset to a map-frame Nav2 goal.
    safety_level: navigation
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 30
    requires_human_confirm: false
    preconditions:
      - robot_mode_auto
      - localization_healthy
      - nav2_active
      - current_pose_available
    sim_supported: true
    real_supported: true

  - name: move_relative_xy
    group: base_motion
    version: 0.1.0
    description: Move by a body-frame dx/dy offset, useful for diagonal relative motion such as front-left.
    safety_level: navigation
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 30
    requires_human_confirm: false
    preconditions:
      - robot_mode_auto
      - localization_healthy
      - nav2_active
      - current_pose_available
    sim_supported: true
    real_supported: true

  - name: rotate_relative
    group: base_motion
    version: 0.1.0
    description: Rotate in place by a relative yaw angle using a map-frame Nav2 goal at the current position.
    safety_level: navigation
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 30
    requires_human_confirm: false
    preconditions:
      - robot_mode_auto
      - localization_healthy
      - nav2_active
      - current_pose_available
    sim_supported: true
    real_supported: true

  - name: cancel_motion
    group: base_motion
    version: 0.1.0
    description: Cancel active motion goals.
    safety_level: safety
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 2
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: capture_observation
    group: view_camera
    version: 0.1.0
    description: Capture a mission observation from the current camera state. It should not rely on remembered camera angles.
    safety_level: perception
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 3
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: detect_known_object
    group: perception_detection
    version: 0.1.0
    description: Detect a known object or label from captured observations. First real provider is YOLO11s plus OCR/rules; missing model/dependencies return PERCEPTION_STUB.
    safety_level: perception
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 5
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: set_camera_pose
    group: view_camera
    version: 0.1.0
    description: Command camera pan/tilt within bounded limits and wait briefly for feedback when available.
    safety_level: manipulation_lite
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 2
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: move_lift_bounded
    group: manipulation_lite
    version: 0.1.0
    description: Move lift by a bounded requested distance, converted to a timed UP/DOWN command plus timer-based STOP.
    safety_level: manipulation_lite
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 6
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: set_pose
    group: arm
    version: 0.1.0
    description: Play a predefined named arm pose or rough gesture sequence through the guarded arm dashboard gateway.
    safety_level: motion
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 15
    requires_human_confirm: false
    sim_supported: true
    real_supported: true

  - name: touch
    group: arm
    version: 0.1.0
    description: Touch or press a visible detected target through Touch Anything.
    safety_level: motion
    allowed_modes: [dry_run, sim, real]
    timeout_sec: 45
    requires_human_confirm: true
    sim_supported: true
    real_supported: true

  - name: grasp
    group: arm
    version: 0.1.0
    description: Grasp and optionally place a visible target through a configured VLA policy endpoint.
    safety_level: motion
    allowed_modes: [dry_run, sim]
    timeout_sec: 60
    requires_human_confirm: true
    sim_supported: true
    real_supported: false
